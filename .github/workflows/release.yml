name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Use a PAT so the version-PR is created by a real user. The org policy
          # blocks the Actions bot (GITHUB_TOKEN) from creating PRs; a PAT is not
          # subject to that restriction. Falls back to GITHUB_TOKEN if unset.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; ensure a current npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          # No NPM_TOKEN: publishing authenticates via OIDC Trusted Publishing.
          # Provenance is automatic under OIDC. The PAT is only for the version PR.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
